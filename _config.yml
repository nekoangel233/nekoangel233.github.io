# SEO 验证（暂时留空）
google_site_verification :
bing_site_verification   :
baidu_site_verification  :

# ================================
# 左侧个人资料
# ================================
author:
  name             : "ZHE JIN | 金喆"
  avatar           : "images/avatar.png"
  bio              : "Undergraduate Researcher @ Emory University"
  location         : "Atlanta, GA"
  employer         : "Emory University"
  pubmed           :
  googlescholar    :
  email            : "zhe.jin@emory.edu"
  researchgate     :
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
